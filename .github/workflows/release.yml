name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  package:
    name: Build signed package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Fetch sources
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release version
        id: version
        shell: bash
        run: |
          VERSION="$(./gradlew properties --property version --quiet --console=plain | sed -n 's/^version: //p')"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Gradle version must be stable SemVer, got: $VERSION" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Gradle version $VERSION" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Initial signed packages must be built from main" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        shell: bash
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          for name in CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Build, verify, and sign plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew buildPlugin verifyPlugin signPlugin

      - name: Upload signed package
        uses: actions/upload-artifact@v7
        with:
          name: selection-annotation-${{ steps.version.outputs.value }}-signed
          path: build/distributions/*-signed.zip
          if-no-files-found: error

      - name: Record package status
        run: |
          echo "### Signed package ${{ steps.version.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Built for the initial manual Marketplace upload; no Marketplace upload was attempted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Built and verified for Marketplace upload by the next job." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Upload to JetBrains Marketplace
    if: ${{ github.event_name == 'push' }}
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sources
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check publishing secrets
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          for name in PUBLISH_TOKEN CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      - name: Record Marketplace upload status
        run: |
          echo "### Marketplace upload accepted" >> "$GITHUB_STEP_SUMMARY"
          echo "Version ${{ needs.package.outputs.version }} was uploaded successfully. JetBrains review is still required before public availability." >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Create GitHub Release
    if: ${{ github.event_name == 'push' }}
    needs: [package, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch sources
        uses: actions/checkout@v6

      - name: Download signed package
        uses: actions/download-artifact@v8
        with:
          name: selection-annotation-${{ needs.package.outputs.version }}-signed
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*-signed.zip \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
